<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.6" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.012 0.42" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.16" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="420" height="420" filter="url(#grain)" opacity="0.55"/>
  <rect width="420" height="420" filter="url(#fiber)" opacity="0.5"/>
</svg>
